<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin · Domino’s Bangladesh (concept)</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Crect x='4' y='7' width='26' height='20' rx='4' fill='%23e31837'/%3E%3Cpath d='M17 7h9a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4h-9Z' fill='%23006491'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      /* paint the saved theme before React loads, so dark mode doesn't flash white */
      try { var d = JSON.parse(localStorage.getItem('dpz-concept:admin:theme')); if (d ?? matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.style.background = '#121416'; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* double-clicking this file can't run the app; say how to open it */
      if (location.protocol === 'file:') document.getElementById('root').innerHTML =
        '<div style="font:16px/1.6 system-ui;max-width:560px;margin:15vh auto;padding:24px"><h1 style="font-size:24px">Open the admin through the dev server</h1>' +
        '<p>This file does not run by double-clicking. In the <code>dominos-redesign</code> folder run:</p><pre style="background:#eee;padding:12px;border-radius:8px">npm run dev</pre>' +
        '<p>then open <a href="http://localhost:5173/admin/">http://localhost:5173/admin/</a></p></div>';
    </script>
    <script type="module" src="../src/admin/main.jsx"></script>
  </body>
</html>
